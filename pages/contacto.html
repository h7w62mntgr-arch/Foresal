<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./contacto.css">
</head>
<body class="contact-page">
    <header class="contact-hero">
        <div class="container d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <h1 class="contact-title mb-1">Contactanos</h1>
                <p class="contact-subtitle mb-0">Estamos para ayudarte</p>
            </div>
            <div class="contact-links d-flex align-items-center gap-3">
                <a href="../indexx.html">Inicio</a>
                <a href="./servicios.html">Servicios</a>
                <a href="./sobrenosotros.html">Sobre Nosotros</a>
                <a href="./serparte.html">Ser Parte</a>
            </div>
        </div>
    </header>

    <main class="contact-main container">
        <div class="contact-grid">
            <div class="contact-card">
                <i class="bi bi-telephone-fill"></i>
                <div>
                    <div class="contact-label">Telefono</div>
                    <div class="contact-value">+59 23382373</div>
                </div>
            </div>
            <div class="contact-card">
                <i class="bi bi-envelope-fill"></i>
                <div>
                    <div class="contact-label">Gmail</div>
                    <div class="contact-value">Foresal@gmail.com</div>
                </div>
            </div>
            <div class="contact-card">
                <i class="bi bi-house-fill"></i>
                <div>
                    <div class="contact-label">Direccion</div>
                    <div class="contact-value">Av baltasar brum 623</div>
                </div>
            </div>
            <div class="contact-card">
                <i class="bi bi-facebook"></i>
                <div>
                    <div class="contact-label">Redes sociales</div>
                    <div class="contact-value">Foresal_</div>
                </div>
            </div>
            <div class="contact-placeholder map">
                <i class="bi bi-map"></i>
            </div>
            <div class="contact-placeholder image">
                <i class="bi bi-image"></i>
            </div>
        </div>

        <section class="contact-form-block">
            <div>
                <h2>Escríbenos</h2>
                <p>Déjanos tu nombre, correo y consulta. Te responderemos a la brevedad.</p>
            </div>
            <form class="contact-form">
                <label>
                    <span>Nombre</span>
                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </label>
                <label>
                    <span>Email</span>
                    <input type="email" name="email" placeholder="tu@email.com" required>
                </label>
                <label>
                    <span>Mensaje</span>
                    <textarea name="mensaje" rows="4" placeholder="Contanos en qué podemos ayudarte" required></textarea>
                </label>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="contact-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
